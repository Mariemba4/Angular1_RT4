<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white text-center py-3">
          <h1 class="h5 mb-0">Connexion — CvTech</h1>
        </div>
        <div class="card-body p-4">
          <form novalidate (submit)="onSubmit($event)">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                id="email"
                [formField]="loginForm.email"
                [class.is-invalid]="
                  loginForm.email().invalid() &&
                  (loginForm.email().touched() || loginForm.email().dirty())
                "
                class="form-control"
                placeholder="nom@exemple.com"
              />
              @if (
                loginForm.email().invalid() &&
                (loginForm.email().touched() || loginForm.email().dirty())
              ) {
                @for (error of loginForm.email().errors(); track error.kind) {
                  <div class="text-danger small mt-1">{{ error.message }}</div>
                }
              }
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                [formField]="loginForm.password"
                [class.is-invalid]="
                  loginForm.password().invalid() &&
                  (loginForm.password().touched() || loginForm.password().dirty())
                "
                class="form-control"
                placeholder="Votre mot de passe"
              />
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm().invalid()">
              Envoyer
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
